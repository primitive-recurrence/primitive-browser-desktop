name: Primitive Browser full build

permissions:
  contents: read

on:
  pull_request:
    branches:
      - dev
    paths:
      - "src/zen/primitive/**"
      - "src/zen/common/ZenPreloadedScripts.js"
      - "src/browser/base/content/zen-assets.inc.xhtml"
      - "src/browser/base/content/zen-assets.jar.inc.mn"
      - "scripts/primitive_smoke_check.py"
      - "package.json"
      - "surfer.json"
      - ".github/workflows/primitive-browser-build.yml"

concurrency:
  group: primitive-browser-full-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    name: Firefox import and compile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Restore Surfer engine cache
        uses: actions/cache@v5
        with:
          path: .surfer/engine/
          key: primitive-surfer-engine-${{ hashFiles('surfer.json') }}

      - name: Setup Git for Surfer and Firefox bootstrap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Primitive static gates
        run: |
          npm run test:primitive
          npm run test:primitive:syntax

      - name: Download Firefox and dependencies
        run: npm run download

      - name: Bootstrap Firefox toolchain
        run: npm run bootstrap

      - name: Prepare engine ignore file
        run: touch engine/.hgignore

      - name: Import Primitive patches
        run: npm run import

      - name: Explain license scope
        run: |
          echo "Skipping repo-wide surfer license-check as a release blocker."
          echo "The inherited Zen tree contains upstream binary/test fixtures that cannot carry source headers."
          echo "Primitive-owned source licensing is reviewed independently; this job validates the exact committed tree compiles."

      - name: Compile Firefox fork
        run: npm run build
