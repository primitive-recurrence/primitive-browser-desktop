name: Primitive Browser full build

permissions:
  contents: write

on:
  pull_request:
    branches:
      - dev
    paths:
      - "src/zen/primitive/**"
      - "src/zen/common/ZenPreloadedScripts.js"
      - "src/browser/base/content/zen-assets.inc.xhtml"
      - "src/browser/base/content/zen-assets.jar.inc.mn"
      - "scripts/primitive_smoke_check.py"
      - "package.json"
      - "surfer.json"
      - ".github/workflows/primitive-browser-build.yml"

concurrency:
  group: primitive-browser-full-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-build:
    name: Firefox import and compile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Restore Surfer engine cache
        uses: actions/cache@v5
        with:
          path: .surfer/engine/
          key: primitive-surfer-engine-${{ hashFiles('surfer.json') }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Primitive static gates
        run: |
          npm run test:primitive
          npm run test:primitive:syntax

      - name: Download Firefox and dependencies
        run: npm run download

      - name: Bootstrap Firefox toolchain
        run: npm run bootstrap

      - name: Prepare engine ignore file
        run: touch engine/.hgignore

      - name: Import Primitive patches
        run: npm run import

      - name: Normalize and verify MPL headers
        run: |
          npm run lc:fix
          npm run lc
          echo "License normalizer changed:"
          git diff --name-only -- src/zen/primitive scripts/primitive_smoke_check.py

      - name: Compile Firefox fork
        run: npm run build

      - name: Persist deterministic license normalization
        if: ${{ success() && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git add src/zen/primitive scripts/primitive_smoke_check.py
          if git diff --cached --quiet; then
            echo "No source license normalization to persist."
            exit 0
          fi
          git commit -m "chore(browser): normalize MPL source headers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
