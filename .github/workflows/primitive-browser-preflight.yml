name: Primitive Browser preflight

on:
  push:
    branches:
      - "primitive/**"
    paths:
      - "src/zen/primitive/**"
      - "src/zen/common/ZenPreloadedScripts.js"
      - "src/browser/base/content/zen-assets.inc.xhtml"
      - "src/browser/base/content/zen-assets.jar.inc.mn"
      - "scripts/primitive_smoke_check.py"
      - "package.json"
      - "surfer.json"
      - ".github/workflows/primitive-browser-preflight.yml"
  pull_request:
    paths:
      - "src/zen/primitive/**"
      - "src/zen/common/ZenPreloadedScripts.js"
      - "src/browser/base/content/zen-assets.inc.xhtml"
      - "src/browser/base/content/zen-assets.jar.inc.mn"
      - "scripts/primitive_smoke_check.py"
      - "package.json"
      - "surfer.json"
      - ".github/workflows/primitive-browser-preflight.yml"

permissions:
  contents: read

jobs:
  static-preflight:
    name: static preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Primitive integration seams
        run: python3 scripts/primitive_smoke_check.py

      - name: Primitive module syntax
        run: npm run test:primitive:syntax
