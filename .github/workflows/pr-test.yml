name: Pull request test
permissions:
  contents: write

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Restore Surfer engine cache
        id: surfer-engine-cache
        uses: actions/cache@v5
        with:
          path: .surfer/engine/
          key: surfer-engine-${{ hashFiles('surfer.json') }}

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Normalize semantic lint findings
        run: python3 scripts/primitive_semantic_lint_fix.py

      - name: Download Firefox and dependencies
        run: npm run download

      - name: Run Bootstrap
        run: npm run bootstrap

      - name: Add .hgignore file to the engine dir
        run: touch engine/.hgignore

      - name: Import patches
        run: npm run import

      - name: Apply Mozilla autofixes to Primitive modules
        run: cd engine && ./mach lint --fix -f unix zen/primitive || true

      - name: Run real Primitive lint gate
        run: cd engine && ./mach lint -f unix zen/primitive

      - name: Verify source diff
        run: |
          git diff --check
          python3 scripts/primitive_smoke_check.py

      - name: Commit normalized Primitive source
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- src/zen/primitive; then
            echo "Primitive source already normalized."
            exit 0
          fi
          git add src/zen/primitive
          git commit -m "fix(browser): normalize Primitive modules for Mozilla lint"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
